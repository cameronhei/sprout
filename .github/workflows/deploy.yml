# Builds Sprout and publishes it to GitHub Pages every time you push to master (or main).
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy Sprout to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the tests
        run: dotnet test Sprout/Sprout.Core.Tests/Sprout.Core.Tests.csproj -c Release

      - name: Publish the app
        run: dotnet publish Sprout/Sprout/Sprout.csproj -c Release -o publish

      # 404.html lets links like /work open the app instead of GitHub's error page.
      # .nojekyll stops GitHub from hiding the _framework folder.
      - name: Prepare for GitHub Pages
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
